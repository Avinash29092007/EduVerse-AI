<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Senior Blueprint — EduVerse AI</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="ev-app">
<div class="ev-sidebar-backdrop"></div>
<aside class="ev-sidebar">
  <a href="index.html" class="ev-logo"><span class="dot"></span>EduVerse AI</a>
  <nav class="d-flex flex-column gap-1">
    <a href="dashboard.html" class="ev-nav-link "><i class="bi bi-grid-1x2-fill"></i> Dashboard</a>
    <a href="performance.html" class="ev-nav-link "><i class="bi bi-graph-up-arrow"></i> Performance</a>
    <a href="career.html" class="ev-nav-link "><i class="bi bi-briefcase-fill"></i> Career Path</a>
    <a href="learning-dna.html" class="ev-nav-link "><i class="bi bi-diagram-3-fill"></i> Learning DNA</a>
    <a href="senior-blueprint.html" class="ev-nav-link active"><i class="bi bi-people-fill"></i> Senior Blueprint</a>
    <a href="profile.html" class="ev-nav-link "><i class="bi bi-person-circle"></i> Profile</a>
  </nav>
  <div class="mt-auto">
    <div class="ev-sidebar-profile mb-2">
      <div class="ev-avatar" data-student="initials">AM</div>
      <div class="flex-grow-1 min-w-0">
        <div class="fw-semibold small text-truncate" data-student="name">Avinash M</div>
        <div class="text-muted-ev" style="font-size:.75rem;" data-student="dept">AI &amp; Data Science</div>
      </div>
    </div>
    <a href="index.html" class="ev-nav-link"><i class="bi bi-box-arrow-right"></i> Logout</a>
  </div>
</aside>

<main class="ev-main">
  <div class="ev-topbar">
    <div class="d-flex align-items-center gap-2">
      <button class="sidebar-toggle-btn d-lg-none" aria-label="Open menu"><i class="bi bi-list"></i></button>
      <h5 class="mb-0 d-none d-md-block">Senior Blueprint</h5>
    </div>
    <div class="d-flex align-items-center gap-2">
      <button class="theme-toggle" aria-label="Toggle theme"><i class="bi bi-moon-stars"></i></button>
      <img src="" alt="" class="d-none">
      <div class="ev-avatar d-none d-sm-flex" style="width:36px;height:36px;font-size:.8rem;" data-student="initials">AM</div>
    </div>
  </div>
  <div class="ev-content">
<div class="mb-4">
  <a href="senior-blueprint.html" class="text-muted-ev small"><i class="bi bi-arrow-left me-1"></i> Back to Senior Blueprint</a>
</div>

<div id="blueprintDetail"></div>

<!-- Toast confirming the demo "add to roadmap" interaction -->
<div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:1400;">
  <div id="roadmapToast" class="toast align-items-center text-white border-0" style="background:var(--ev-gradient);" role="status">
    <div class="d-flex">
      <div class="toast-body"><i class="bi bi-check2-circle me-2"></i>Senior's path added as inspiration to your roadmap.</div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id') || 'rahul';
  const senior = EDUVERSE_DEMO.seniors.find(s => s.id === id) || EDUVERSE_DEMO.seniors[0];
  const wrap = document.getElementById('blueprintDetail');

  const journeyHtml = senior.journey.map(step => `
    <div class="journey-node" data-sem="${step.sem}">
      <div class="ev-card ev-card-pad" style="box-shadow:none; background:var(--bg-sunken);">
        <div class="text-muted-ev small mb-1">Semester ${step.sem}</div>
        <h6 class="mb-1">${step.title}</h6>
        <p class="small text-muted-ev mb-0">${step.detail}</p>
      </div>
    </div>
  `).join('');

  const skillsHtml = senior.skills.map(s => `<span class="ev-chip have">${s}</span>`).join('');
  const certsHtml = senior.certifications.map(c => `<li class="d-flex gap-2 small mb-1"><i class="bi bi-patch-check text-primary mt-1"></i>${c}</li>`).join('');

  wrap.innerHTML = `
    <div class="ev-card ev-card-pad mb-4">
      <div class="d-flex flex-wrap justify-content-between align-items-start gap-3">
        <div class="d-flex align-items-center gap-3">
          <div class="ev-avatar" style="width:56px;height:56px;font-size:1.1rem;">${senior.name.split(' ').map(w=>w[0]).join('').slice(0,2)}</div>
          <div>
            <h4 class="mb-0">${senior.name}</h4>
            <span class="text-muted-ev small">${senior.dept} · CGPA ${senior.cgpa} · ${senior.similarity}% profile match</span>
          </div>
        </div>
        <span class="ev-badge"><i class="bi bi-trophy"></i> ${senior.role}</span>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-lg-8">
        <div class="ev-card ev-card-pad">
          <h6 class="mb-4"><i class="bi bi-signpost-split me-2"></i>Semester-by-Semester Journey</h6>
          <div class="journey-track">${journeyHtml}</div>
        </div>
      </div>
      <div class="col-lg-4">
        <div class="ev-card ev-card-pad mb-3">
          <h6 class="mb-3">Skills Learned</h6>
          <div class="d-flex flex-wrap gap-2 mb-3">${skillsHtml}</div>
          <div class="row text-center g-2">
            <div class="col-4"><div class="fw-bold font-mono">${senior.projects}</div><div class="text-muted-ev" style="font-size:.72rem;">Projects</div></div>
            <div class="col-4"><div class="fw-bold font-mono">${senior.internships}</div><div class="text-muted-ev" style="font-size:.72rem;">Internships</div></div>
            <div class="col-4"><div class="fw-bold font-mono" style="font-size:.72rem;">${senior.certifications.length}</div><div class="text-muted-ev" style="font-size:.72rem;">Certs</div></div>
          </div>
        </div>
        <div class="ev-card ev-card-pad mb-3">
          <h6 class="mb-2">Certifications</h6>
          <ul class="list-unstyled mb-0">${certsHtml}</ul>
        </div>
        <div class="ev-card ev-card-pad mb-3">
          <h6 class="mb-1">Career Outcome</h6>
          <p class="small text-muted-ev mb-0">${senior.outcome}</p>
        </div>
        <button id="buildPathBtn" class="btn-ev-primary w-100"><i class="bi bi-signpost-2 me-2"></i>Build My Path Like This</button>
      </div>
    </div>
  `;
});
</script>
  </div>
</main>
</div>

<nav class="ev-bottom-nav">
  <a href="dashboard.html" class="item "><i class="bi bi-grid-1x2-fill"></i>Home</a>
  <a href="performance.html" class="item "><i class="bi bi-graph-up-arrow"></i>Perform</a>
  <a href="career.html" class="item "><i class="bi bi-briefcase-fill"></i>Career</a>
  <a href="learning-dna.html" class="item "><i class="bi bi-diagram-3-fill"></i>DNA</a>
  <a href="senior-blueprint.html" class="item active"><i class="bi bi-people-fill"></i>Seniors</a>
  <a href="profile.html" class="item "><i class="bi bi-person-circle"></i>Profile</a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="script.js"></script>
</body>
</html>
