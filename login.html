<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — EduVerse AI</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    <div class="text-center mb-4">
      <a href="index.html" class="ev-logo justify-content-center"><span class="dot"></span>EduVerse AI</a>
    </div>
    <div class="ev-card ev-card-pad">
      <div class="d-flex justify-content-between align-items-start mb-3">
        <div>
          <h4 class="mb-1">Welcome back</h4>
          <p class="text-muted-ev small mb-0">Log in to see your success roadmap.</p>
        </div>
        <button class="theme-toggle" aria-label="Toggle theme"><i class="bi bi-moon-stars"></i></button>
      </div>

      <form class="needs-validation" novalidate data-success-redirect="dashboard.html">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" placeholder="               " required>
          <div class="invalid-feedback">Please enter a valid email.</div>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" placeholder="••••••••" required minlength="4">
          <div class="invalid-feedback">Password must be at least 4 characters.</div>
        </div>
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="remember">
            <label class="form-check-label small text-muted-ev" for="remember">Remember me</label>
          </div>
          <a href="#" class="small text-muted-ev">Forgot password?</a>
        </div>
        <button type="submit" class="btn-ev-primary w-100 mb-2">Login</button>
        <button type="button" id="demoLoginBtn" class="btn-ev-outline w-100">
          <i class="bi bi-lightning-charge me-1"></i> Demo Login
        </button>
      </form>

      <p class="text-center text-muted-ev small mt-4 mb-0">
        Don't have an account? <a href="register.html" class="fw-semibold" style="color:var(--ev-indigo);">Create Account</a>
      </p>
    </div>
    <p class="text-center text-muted-ev small mt-3 mb-0">
      <i class="bi bi-info-circle me-1"></i> This is a frontend prototype — no real authentication is performed.
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
